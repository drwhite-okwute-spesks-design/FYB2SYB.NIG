<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Registration | FYB2SYB</title><style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f6f2;
  color: #26372c;
}

header {
  background: #075c38;
  color: white;
  text-align: center;
  padding: 22px 15px;
  border-bottom: 4px solid #d5a52b;
}

header h1 { margin: 0; }
header span { color: #f1c64f; }
header p { margin-bottom: 0; font-size: 13px; }

header a {
  display: inline-block;
  margin-top: 12px;
  color: white;
  text-decoration: none;
}

.container {
  max-width: 480px;
  margin: 30px auto;
  padding: 0 15px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  border-top: 5px solid #d5a52b;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

h2 {
  text-align: center;
  color: #075c38;
  margin-top: 0;
}

.intro {
  text-align: center;
  color: #68776e;
  font-size: 14px;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-size: 14px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccd7ce;
  border-radius: 7px;
  background: white;
  font-size: 15px;
}

input:focus, select:focus {
  outline: 2px solid #b6d9c5;
  border-color: #075c38;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  border: 0;
  border-radius: 7px;
  background: #075c38;
  color: white;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:hover { background: #043d27; }

.message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 6px;
  background: #fff5d9;
  color: #695315;
  font-size: 13px;
}

.links {
  margin-top: 20px;
  text-align: center;
  font-size: 14px;
}

.links a {
  color: #075c38;
  font-weight: bold;
  text-decoration: none;
}

footer {
  text-align: center;
  padding: 20px;
  color: #68776e;
  font-size: 12px;
}
</style></head><body><header>
  <h1>FYB2SYB <span>2027</span></h1>
  <p>Member Registration</p>
  <a href="index.html">← Back to Homepage</a>
</header><main class="container">
  <section class="card">
    <h2>Create Your Account</h2>
    <p class="intro">Complete the form to prepare your member registration.</p><form id="registerForm">
  <label for="fullname">Full Name</label>
  <input id="fullname" name="fullname" type="text"
    placeholder="Enter your full name" autocomplete="name" required>

  <label for="email">Email Address</label>
  <input id="email" name="email" type="email"
    placeholder="Enter your email" autocomplete="email" required>

  <label for="phone">Phone Number (optional)</label>
  <input id="phone" name="phone" type="tel"
    placeholder="Enter your phone number" autocomplete="tel">

  <label for="state">State</label>
  <select id="state" name="state" required>
    <option value="">Select your state</option>
    <option>Abia</option>
    <option>Adamawa</option>
    <option>Akwa Ibom</option>
    <option>Anambra</option>
    <option>Bauchi</option>
    <option>Bayelsa</option>
    <option>Benue</option>
    <option>Borno</option>
    <option>Cross River</option>
    <option>Delta</option>
    <option>Ebonyi</option>
    <option>Edo</option>
    <option>Ekiti</option>
    <option>Enugu</option>
    <option>Gombe</option>
    <option>Imo</option>
    <option>Jigawa</option>
    <option>Kaduna</option>
    <option>Kano</option>
    <option>Katsina</option>
    <option>Kebbi</option>
    <option>Kogi</option>
    <option>Kwara</option>
    <option>Lagos</option>
    <option>Nasarawa</option>
    <option>Niger</option>
    <option>Ogun</option>
    <option>Ondo</option>
    <option>Osun</option>
    <option>Oyo</option>
    <option>Plateau</option>
    <option>Rivers</option>
    <option>Sokoto</option>
    <option>Taraba</option>
    <option>Yobe</option>
    <option>Zamfara</option>
    <option>Federal Capital Territory</option>
  </select>

  <label for="password">Create Password</label>
  <input id="password" name="password" type="password"
    placeholder="At least 8 characters"
    minlength="8" autocomplete="new-password" required>

  <label for="confirmPassword">Confirm Password</label>
  <input id="confirmPassword" name="confirmPassword" type="password"
    placeholder="Re-enter your password"
    minlength="8" autocomplete="new-password" required>

  <button type="submit">Register</button>

  <div class="message" id="message" role="status"></div>
</form>

<div class="links">
  Already registered? <a href="login.html">Login here</a>
</div>

  </section>
</main><footer>
  &copy; <span id="year"></span> FYB2SYB. All rights reserved.
</footer><script>
document.getElementById("year").textContent = new Date().getFullYear();

document.getElementById("registerForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const message = document.getElementById("message");

  message.style.display = "block";

  if (password !== confirmPassword) {
    message.textContent = "Your passwords do not match. Please check and try again.";
    return;
  }

  message.textContent =
    "The registration page design is ready, but account creation is not active yet. Connect Supabase Authentication before collecting or saving real member accounts.";
});
</script></body>
</html>
